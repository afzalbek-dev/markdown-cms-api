[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-cms-api"
version = "1.0.0"
description = "Git-backed flat-file headless Markdown content management engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0"
]
license = {text = "MIT"}
authors = [{name = "Afzalbek", email = "afzalbek-dev@users.noreply.github.com"}]

[project.scripts]
markdown-cms = "markdown_cms.cli:main"
